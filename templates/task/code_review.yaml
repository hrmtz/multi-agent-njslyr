task:
  task_id: "{{task_id}}"
  parent_cmd: "{{parent_cmd}}"
  bloom_level: "{{bloom_level}}"
  description: |
    **Code Review / QC: {{target_task_id}} — {{title}}**

    **背景**:
    {{background}}

    **レビュー対象タスク**: {{target_task_id}}

    **報告YAML**: {{report_yaml_path}}

    **レビュー観点**:
    {{review_criteria}}

    **検証項目**:
    1. **機能性**: 実装が要件を満たしているか
    2. **正確性**: コードにバグ・ロジックエラーがないか
    3. **完全性**: Acceptance Criteriaが全て満たされているか
    4. **安全性**: Destructive Operation Safety違反がないか
    5. **品質**: コードの可読性・保守性が適切か

    **作業手順**:
    1. 報告YAML（{{report_yaml_path}}）を読む
    2. 修正対象ファイル（{{target_path}}）を読む
    3. 修正内容が要件を満たしているか検証
    4. Acceptance Criteria全項目をチェック
    5. テスト結果確認（該当する場合）
    6. QC結果をdashboard.mdに反映
    7. チームリードにinbox報告（PASS/FAIL）

    **PASS基準**:
    - 全Acceptance Criteria満たされている
    - Destructive Operation Safety違反なし
    - テスト実行結果PASS（該当する場合）
    - 報告YAMLに不備なし

    **Acceptance Criteria**:
    - [ ] 報告YAML読み込み完了
    - [ ] 修正対象ファイル検証完了
    - [ ] 全検証項目チェック完了
    - [ ] QC結果判定（PASS/FAIL）
    - [ ] dashboard.md更新完了
    - [ ] チームリードにinbox報告完了

    **Notes**:
    - QC FAILの場合、具体的な指摘事項を報告に記載
    - 動画QCの場合、Visual検証必須（MEMORY.md QCルール強化）
    {{notes}}

  target_path: "{{target_path}}"
  status: assigned
  timestamp: "{{timestamp}}"
